<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoWin - Rekap Setoran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>EcoWin</h1>
    <nav>
      <a href="index.html">Kembali ke Formulir</a>
    </nav>
  </header>

  <main class="konten">
    <h2>Rekap Setoran</h2>

    <div class="alat">
      <div class="isian">
        <label for="cari">Cari</label>
        <input type="text" id="cari" placeholder="Nasabah, jenis, atau kondisi" autocomplete="off">
      </div>
      <div class="isian">
        <label for="filter-jenis">Jenis</label>
        <select id="filter-jenis">
          <option value="">Semua jenis</option>
        </select>
      </div>
      <button type="button" id="unduh-csv">Unduh CSV</button>
    </div>

    <p class="jumlah" id="jumlah-setoran" aria-live="polite"></p>

    <div class="tabel-bungkus">
      <table id="tabel-rekap">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nasabah</th>
            <th>Kategori</th>
            <th>Jenis</th>
            <th>Kondisi</th>
            <th>Berat (kg)</th>
            <th>Nilai (Rp)</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Urutan script: data, penyimpanan, logika, lalu rekap. data.js dipakai
       untuk daftar jenis pada filter. -->
  <script src="data.js"></script>
  <script src="penyimpanan.js"></script>
  <script src="logika.js"></script>
  <script src="rekap.js"></script>
</body>
</html>
